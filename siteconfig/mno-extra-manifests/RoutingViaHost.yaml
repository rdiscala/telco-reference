---
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  # TODO(yprokule): is it required to specify cluster/service networks?
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
  defaultNetwork:
    type: OVNKubernetes
    ovnKubernetesConfig:
      mtu: 8900
      gatewayConfig:
        ipForwarding: "Global"
        routingViaHost: true
