    clusterLabels:
      site: "ecore"
      zone: "tlv2"
      group: "rdscore"
      version: "4.18"
    # Network range where the MNO nodes are connected
    machineNetwork:
      - cidr: "10.46.187.0/26"
      - cidr: "2620:52:0:2ebb::/122"
    # Pod's SDN network range
    clusterNetwork:
      - cidr: "10.128.0.0/14"
        hostPrefix: 23
      - cidr: "fd01::/48"
        hostPrefix: 64
    # Services SDN network range
    serviceNetwork:
      - "172.30.0.0/16"
      - "fd02::/112"
