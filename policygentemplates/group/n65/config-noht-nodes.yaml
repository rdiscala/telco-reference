---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "standardworker"
  namespace: "ztp-group"
spec:
  bindingRules:
    group: "n65"
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    # NOTE: move to "customer" directory
    - fileName: MachineConfigPool.yaml
      policyName: config-nodes-mcp
      metadata:
        name: standard
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
        labels:
          machineconfiguration.openshift.io/role: standard
          pools.operator.machineconfiguration.openshift.io/standard: ""
      spec:
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values: [worker, standard]
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/standard: ""
    # configure system reserved memory
    - fileName: optional/tuning/control-plane-system-reserved.yaml
      policyName: "post-install-tunning"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "4"
    # configure Chronyd for control-plane nodes in disconnected setup
    # NOTE: move to "customer" directory
    - fileName: MachineConfigGeneric.yaml
      policyName: "config-mc"
      complianceType: mustonlyhave
      metadata:
        name: 98-master-etc-chrony-conf
        annotations:
          ran.openshift.io/ztp-deploy-wave: "4"
        labels:
          machineconfiguration.openshift.io/role: master
      spec:
        config:
          # Release info found in https://github.com/coreos/butane/releases
          ignition:
            version: 3.2.0
          storage:
            files:
            - contents:
                source: data:text/plain;charset=utf-8;base64,
                verification: {}
              filesystem: root
              group:
                name: root
              mode: 420
              path: /etc/chrony.conf
              user:
                name: root
    # configure Chronyd for non control-plane nodes in disconnected setup
    - fileName: MachineConfigGeneric.yaml
      policyName: "config-mc"
      complianceType: mustonlyhave
      metadata:
        name: 98-worker-etc-chrony-conf
        annotations:
          ran.openshift.io/ztp-deploy-wave: "4"
        labels:
          machineconfiguration.openshift.io/role: worker
      spec:
        config:
          # Release info found in https://github.com/coreos/butane/releases
          ignition:
            version: 3.2.0
          storage:
            files:
            - contents:
                source: data:text/plain;charset=utf-8;base64,
                verification: {}
              filesystem: root
              group:
                name: root
              mode: 420
              path: /etc/chrony.conf
              user:
                name: root
    # configure extra kernel modules on control-plane nodes
    - fileName: optional/other/control-plane-load-kernel-modules.yaml
      policyName: "config-mc"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "4"
    # configure extra kernel modules on worker nodes
    - fileName: optional/other/worker-load-kernel-modules.yaml
      policyName: "config-mc"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "4"
