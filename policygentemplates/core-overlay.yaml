      #        nodeSelector:
      #          $patch: replace
      #          node-role.kubernetes.io/customcnf: ""

      #
      # AMD-TURIN
      #
      - path: source-crs/required/performance/PerformanceProfile.yaml
        complianceType: mustonlyhave
        patches:
          - metadata:
              name: amd-turin
            spec:
              cpu:
                #
                # TODO(yprokule): update to use hub side templating
                #
                isolated: 8-319
                reserved: 0-7
              hugepages:
                defaultHugepagesSize: 1G
                pages:
                - size: 1G
                  count: 32
                  node: 0
              machineConfigPoolSelector:
                $patch: replace
                pools.operator.machineconfiguration.openshift.io/amd-turin: ""
              nodeSelector:
                $patch: replace
                node-role.kubernetes.io/amd-turin: ""

      #
      # INTEL-SIERRA
      #
      - path: source-crs/required/performance/PerformanceProfile.yaml
        complianceType: mustonlyhave
        patches:
          - metadata:
              name: intel-sierra
            spec:
              cpu:
                #
                # TODO(yprokule): update to use hub side templating
                #
                isolated: 2-71,74-143,146-215,218-287
                reserved: 0,1,72,73,144,145,216,217
              hugepages:
                defaultHugepagesSize: 1G
                pages:
                - size: 1G
                  count: 32
                  node: 0
                - size: 1G
                  count: 32
                  node: 1
              machineConfigPoolSelector:
                $patch: replace
                pools.operator.machineconfiguration.openshift.io/intel-sierra: ""
              nodeSelector:
                $patch: replace
                node-role.kubernetes.io/intel-sierra: ""

      - path: source-crs/required/performance/TunedPerformancePatch.yaml
        patches:
        - metadata:
            name: custom-telco-core-performance-patch
          spec:
            profile:
              - name: qe-control-plane-profile
                data: |
                  [main]
                  summary=Custom control plane performance tuning overrides
                  include=openshift-control-plane
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
              - name: qe-customcnf-profile
                data: |
                  [main]
                  summary=Custom compute core performance tuning overrides
                  include=openshift-node-performance-customcnf
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
              - name: qe-standard-profile
                data: |
                  [main]
                  summary=Custom compute core performance tuning overrides
                  include=openshift-node
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
            recommend:
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: master
                priority: 18
                profile: qe-control-plane-profile
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: amd-turin
                priority: 18
                profile: qe-customcnf-profile
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: intel-sierra
                priority: 18
                profile: qe-standard-profile

      - path: source-crs/optional/logging/ClusterLogForwarder.yaml
        patches:
        - spec:
            outputs:
            - type: "kafka"
              name: kafka-open
              kafka:
                # use FQDN when DNS entries for IPv4 and IPv6 are in place
                # only IPv4 IP address works
                #  url: tcp://vran-qe-kafka.lab.eng.tlv2.redhat.com:9092/vran-qe
                #url: tcp://vran-qe-kafka.kni-qe-11.lab.eng.tlv2.redhat.com:9092/vran-qe
                url: '{{hub fromConfigMap "" "regional" (printf "%s-log-url" (index .ManagedClusterLabels "zone")) | toLiteral hub}}'
            filters:
            - name: custom-labels
              type: openshiftLabels
              openshiftLabels:
                sitename: '{{hub fromConfigMap "" "regional" (printf "%s-logging-name" .ManagedClusterName) | toLiteral hub}}'
                siteuuid: '{{hub fromConfigMap "" "regional" (printf "%s-logging-uuid" .ManagedClusterName) | toLiteral hub}}'
                rds: core
            pipelines:
            - name: all-to-default
              inputRefs:
              - audit
              - infrastructure
              filterRefs:
              - custom-labels
              outputRefs:
              - kafka-open

      #
      # Configure MetalLB
      #
      - path: source-crs/required/networking/metallb/metallb.yaml
        patches:
        - spec:
            nodeSelector:
              node-role.kubernetes.io/worker: ""

      - path: source-crs/required/networking/metallb/bfd-profile.yaml
        patches:
          - metadata:
              name: bfd-profile
            spec:
              receiveInterval: 150
              transmitInterval: 100
              detectMultiplier: 3
              echoInterval: 300
              echoMode: false
              passiveMode: false
              minimumTtl: 254

      - path: source-crs/required/networking/metallb/bgp-peer.yaml
        patches:
          - metadata:
              name: greenpeers
            spec:
              keepaliveTime: 0s
              peerAddress: 192.168.34.5
              peerASN: 65435
              myASN: 65450
              holdTime: 3m0s
              bfdProfile: bfd-profile
              peerPort: 179
              disableMP: false
              nodeSelectors:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - openshift-worker-0.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-1.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-2.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-3.ecore.lab.eng.tlv2.redhat.com
              $patch: replace
              routerID: null

      - path: source-crs/required/networking/metallb/bgp-peer.yaml
        patches:
          - metadata:
              name: greenpeers-ipv6
            spec:
              keepaliveTime: 0s
              peerAddress: fd55:5555:4444:3333:2222:1111:0:5
              peerASN: 65435
              myASN: 65450
              holdTime: 3m0s
              bfdProfile: bfd-profile
              peerPort: 179
              disableMP: false
              nodeSelectors:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - openshift-worker-0.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-1.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-2.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-3.ecore.lab.eng.tlv2.redhat.com
              $patch: replace
              routerID: null

      - path: source-crs/required/networking/metallb/community.yaml
        patches:
          - metadata:
              name: greenc
            spec:
              communities:
                - name: greenc
                  value: '7003:008'

      - path: source-crs/required/networking/metallb/bgp-advr.yaml
        patches:
          - metadata:
              name: green
            spec:
              communities:
                - greenc
              ipAddressPools:
                - greenips
              peers:
                - greenpeers
                - greenpeers-ipv6

      - path: source-crs/required/networking/metallb/addr-pool.yaml
        patches:
          - metadata:
              name: greenips
              $patch: replace
              annotations: nul
            spec:
              autoAssign: false
              # this is LB-OAM vlan
              addresses:
                - 192.168.192.20/32
                - 192.168.192.21/32
                - 192.168.192.22/32
                - fd12:2233:3344:4455:5566:6677::20/128
                - fd12:2233:3344:4455:5566:6677::21/128
                - fd12:2233:3344:4455:5566:6677::22/128

      #
      # Configure SR-IOV Policies and Networks
      #
      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovleftmlx-turin
            spec:
              resourceName: "sriovleftmlx"
              nodeSelector:
                node-role.kubernetes.io/amd-turin: ""
              mtu: '{{hub fromConfigMap "" "sriov-config" "sriov-nncp-one-amd-turin-mtu" | toInt hub}}'
              numVfs: '{{hub fromConfigMap "" "sriov-config" "sriov-nncp-one-amd-turin-num-vfs" | toInt hub}}'
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f0np0', 'ens5f0np0']
                pfNames: '{{hub fromConfigMap "" "sriov-config" (printf "%s-sriov-node-policy-1-amd-turin-pfNames" (index .ManagedClusterLabels "group")) | toLiteral hub}}'
              deviceType: netdevice
              isRdma: True

      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
