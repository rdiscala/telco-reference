---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: core-overlay-22
policyDefaults:
  namespace: ztp-core-policies
  policySets: []
  placement:
    labelSelector:
      matchLabels:
        site: "ecore"
        zone: "tlv2"
        version: "4.22"
      # matchExpressions:
      #   - key: ztp-done
      #     operator: DoesNotExist
  remediationAction: "inform"
policies:
  - name: core-overlay-base-4.22
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "2"
    manifests:
      - path: source-crs/required/other/idms.yaml
        patches:
        - spec:
            imageDigestMirrors:
              - mirrors:
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
                source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
              - mirrors:
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
                source: registry.ci.openshift.org/ocp/release
              - mirrors:
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005
                source: registry.redhat.io
              - mirrors:
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005
                source: registry-proxy.engineering.redhat.com
              - mirrors:
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005
                source: registry.stage.redhat.io
              - mirrors:
                  - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-release-nightly
                source: quay.io/openshift-release-dev/ocp-release-nightly

      - path: source-crs/optional/other/sctp_module_mc.yaml
        complianceType: mustonlyhave
      - path: source-crs/optional/other/worker-load-kernel-modules.yaml
        complianceType: mustonlyhave
      - path: source-crs/optional/other/control-plane-load-kernel-modules.yaml
        complianceType: mustonlyhave
      - path: source-crs/optional/networking/multus/tap_cni/mc_rootless_pods_selinux.yaml
  # Custom networking, operator and cluster configuration
  - name: core-overlay-config-4.22
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "8"
    manifests:
      # Set auto sizing of control plane nodes
      - path: source-crs/optional/tuning/control-plane-system-reserved.yaml
      - path: source-crs/required/networking/Network.yaml
        patches:
        - spec:
            additionalNetworks:
            - name: mc-vlan-one
              namespace: rds-macvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "mc-vlan-one", "plugins": [{"type": "macvlan", "master": "bond0.356", "ipam": {}}] }'
              type: Raw
            - name: mc-vlan-two
              namespace: rds-macvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "mc-vlan-two", "plugins": [{"type": "macvlan", "master": "bond0.356", "mode": "private" }]}'
              type: Raw
            - name: ipvlan-one
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-one", "type":"ipvlan", "master":"bond0.358", "ipam":{"type":"static", "addresses":[{"address":"10.46.188.30/26"}, {"address":"2620:0052:0000:2ebc::0030/122"}]}}'
              type: Raw
            - name: ipvlan-two
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-two", "type":"ipvlan", "master":"bond0.358", "ipam":{"type":"static", "addresses":[{"address":"10.46.188.31/26"}, {"address":"2620:0052:0000:2ebc::0031/122"}]}}'
              type: Raw
            - name: ipvlan-three
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-three", "type":"ipvlan", "master":"bond0.358", "ipam":{"type":"static", "addresses":[{"address":"10.46.188.32/26"}, {"address":"2620:0052:0000:2ebc::0032/122"}]}}'
              type: Raw
            - name: ipvlan-four
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-four", "type":"ipvlan", "master":"bond0.358", "ipam":{"type":"static", "addresses":[{"address":"10.46.188.33/26"}, {"address":"2620:0052:0000:2ebc::0033/122"}]}}'
              type: Raw
            - name: rds-whereabouts-one
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-one", "plugins":[{"type":"macvlan",
                "master":"bond0.496", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.0/30"},
                {"range":"fd12:2222:3333:5588::0/124"}]}} ]}'
              type: Raw
            - name: rds-whereabouts-two
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-two", "plugins":[{"type":"macvlan",
                "master":"bond0.496", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.4/30"},
                {"range":"fd12:2222:3333:5588::10/124"}]}} ]}'
              type: Raw
            - name: rds-whereabouts-st-one
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-st-one", "plugins":[{"type":"macvlan",
                "master":"bond0.496", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.8/30"},
                {"range":"fd12:2222:3333:5588::20/124"}]}} ]}'
              type: Raw
            - name: rds-whereabouts-st-two
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-st-two", "plugins":[{"type":"macvlan",
                "master":"bond0.496", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.12/30"},
                {"range":"fd12:2222:3333:5588::30/124"}]}} ]}'
              type: Raw

      - path: source-crs/required/scheduling/nrop.yaml
        patches:
        - spec:
            nodeGroups:
              - config:
                  # Periodic is the default setting
                  infoRefreshMode: Periodic
                machineConfigPoolSelector:
                  matchLabels:
                    # This label must match the pool(s) you want to run NUMA-aligned workloads
                    pools.operator.machineconfiguration.openshift.io/customcnf: ""

      - path: source-crs/required/performance/PerformanceProfile.yaml
        complianceType: mustonlyhave
        patches:
          - metadata:
              name: customcnf
            spec:
              cpu:
                isolated: '{{hub fromConfigMap "" "hw-types" (printf "%s-cnf-isolated-cpu" .ManagedClusterName) | toLiteral hub}}'
                reserved: '{{hub fromConfigMap "" "hw-types" (printf "%s-cnf-reserved-cpu" .ManagedClusterName) | toLiteral hub}}'
              hugepages:
                defaultHugepagesSize: 1G
                # TODO(yprokule): update to use hub side templating
                pages:
                - size: 1G
                  count: 6
                  node: 0
                - size: 1G
                  count: 6
                  node: 1
              machineConfigPoolSelector:
                $patch: replace
                pools.operator.machineconfiguration.openshift.io/customcnf: ""
              nodeSelector:
                $patch: replace
                node-role.kubernetes.io/customcnf: ""


      - path: source-crs/required/performance/TunedPerformancePatch.yaml
        patches:
        - metadata:
            name: custom-telco-core-performance-patch
          spec:
            profile:
              - name: qe-control-plane-profile
                data: |
                  [main]
                  summary=Custom control plane performance tuning overrides
                  include=openshift-control-plane
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
              - name: qe-customcnf-profile
                data: |
                  [main]
                  summary=Custom compute core performance tuning overrides
                  include=openshift-node-performance-customcnf
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
              - name: qe-standard-profile
                data: |
                  [main]
                  summary=Custom compute core performance tuning overrides
                  include=openshift-node
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
            recommend:
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: master
                priority: 18
                profile: qe-control-plane-profile
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: amd-turin
                priority: 18
                profile: qe-customcnf-profile
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: intel-sierra
                priority: 18
                profile: qe-standard-profile

      - path: source-crs/optional/logging/ClusterLogForwarder.yaml
        patches:
        - spec:
            outputs:
            - type: "kafka"
              name: kafka-open
              kafka:
                # use FQDN when DNS entries for IPv4 and IPv6 are in place
                # only IPv4 IP address works
                #  url: tcp://vran-qe-kafka.lab.eng.tlv2.redhat.com:9092/vran-qe
                #url: tcp://vran-qe-kafka.kni-qe-11.lab.eng.tlv2.redhat.com:9092/vran-qe
                url: '{{hub fromConfigMap "" "regional" (printf "%s-log-url" (index .ManagedClusterLabels "zone")) | toLiteral hub}}'
            filters:
            - name: custom-labels
              type: openshiftLabels
              openshiftLabels:
                sitename: '{{hub fromConfigMap "" "regional" (printf "%s-logging-name" .ManagedClusterName) | toLiteral hub}}'
                siteuuid: '{{hub fromConfigMap "" "regional" (printf "%s-logging-uuid" .ManagedClusterName) | toLiteral hub}}'
                rds: core
            pipelines:
            - name: all-to-default
              inputRefs:
              - audit
              - infrastructure
              filterRefs:
              - custom-labels
              outputRefs:
              - kafka-open

      #
      # Configure MetalLB
      #
      - path: source-crs/required/networking/metallb/metallb.yaml
        patches:
        - spec:
            nodeSelector:
              node-role.kubernetes.io/worker: ""

      - path: source-crs/required/networking/metallb/configurationstate.yaml

      - path: source-crs/required/networking/metallb/bfd-profile.yaml
        patches:
          - metadata:
              name: bfd-profile
            spec:
              receiveInterval: 150
              transmitInterval: 100
              detectMultiplier: 3
              echoInterval: 300
              echoMode: false
              passiveMode: false
              minimumTtl: 254

      - path: source-crs/required/networking/metallb/bgp-peer.yaml
        patches:
          - metadata:
              name: greenpeers
            spec:
              keepaliveTime: 0s
              peerAddress: 10.46.188.2
              peerASN: 65435
              myASN: 65450
              holdTime: 3m0s
              bfdProfile: bfd-profile
              peerPort: 179
              nodeSelectors:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - openshift-worker-0.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-1.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-2.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-3.ecore.lab.eng.tlv2.redhat.com
              $patch: replace
              routerID: null

      - path: source-crs/required/networking/metallb/bgp-peer.yaml
        patches:
          - metadata:
              name: greenpeers-ipv6
            spec:
              keepaliveTime: 0s
              peerAddress: 2620:52:0:2ebc::5
              peerASN: 65435
              myASN: 65450
              holdTime: 3m0s
              bfdProfile: bfd-profile
              peerPort: 179
              nodeSelectors:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - openshift-worker-0.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-1.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-2.ecore.lab.eng.tlv2.redhat.com
                        - openshift-worker-3.ecore.lab.eng.tlv2.redhat.com
              $patch: replace
              routerID: null

      - path: source-crs/required/networking/metallb/community.yaml
        patches:
          - metadata:
              name: greenc
            spec:
              communities:
                - name: greenc
                  value: '7003:008'

      - path: source-crs/required/networking/metallb/bgp-advr.yaml
        patches:
          - metadata:
              name: green
            spec:
              communities:
                - greenc
              ipAddressPools:
                - greenips
              peers:
                - greenpeers
                - greenpeers-ipv6


      - path: source-crs/required/networking/metallb/addr-pool.yaml
        patches:
          - metadata:
              name: greenips
              $patch: replace
              annotations: nul
            spec:
              autoAssign: false
              # in ecore setup(registry.ecore.lab.eng.tlv2.redhat.com)
              # this is LB-OAM vlan
              addresses:
                - 10.46.188.20/32
                - 10.46.188.21/32
                - 10.46.188.22/32
                - 2620:0052:0000:2ebc::0020/128
                - 2620:0052:0000:2ebc::0021/128
                - 2620:0052:0000:2ebc::0022/128

      #
      # Configure SR-IOV Policies and Networks
      #
      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovleftdpdkintel
            spec:
              resourceName: "sriovleftdpdkintel"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: '{{hub fromConfigMap "" "sriov-config" "sriov-nncp-one-mtu" | toInt hub}}'
              numVfs: '{{hub fromConfigMap "" "sriov-config" "sriov-nncp-one-num-vfs" | toInt hub}}'
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f0np0', 'ens5f0np0']
                pfNames: '{{hub fromConfigMap "" "sriov-config" (printf "%s-sriov-node-policy-1-pfNames" (index .ManagedClusterLabels "group")) | toLiteral hub}}'
              deviceType: netdevice
              isRdma: False

      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovrightdpdkintel
            spec:
              resourceName: "sriovrightdpdkintel"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: '{{hub fromConfigMap "" "sriov-config" "sriov-nncp-two-mtu" | toInt hub}}'
              numVfs: '{{hub fromConfigMap "" "sriov-config" "sriov-nncp-two-num-vfs" | toInt hub}}'
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f1np1', 'ens5f1np1']
                pfNames: '{{hub fromConfigMap "" "sriov-config" (printf "%s-sriov-node-policy-2-pfNames" (index .ManagedClusterLabels "group")) | toLiteral hub}}'
              deviceType: netdevice
              isRdma: False

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-net-one"
            spec:
              capabilities: '{ "ips": true }'
              ipam: '{}'
              linkState: auto
              networkNamespace: rds-sriov-wlkd
              resourceName: sriovleftdpdkintel
              trust: "on"

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-net-two"
            spec:
              capabilities: '{ "ips": true }'
              ipam: '{}'
              linkState: auto
              networkNamespace: rds-sriov-wlkd
              resourceName: sriovrightdpdkintel
              trust: "on"

      #
      # Create VFs on the Mellanox-NICs with SecureBoot
      #
      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovleftmlx
            spec:
              resourceName: "sriovleftmlx"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: 9000
              numVfs: 24
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f0np0', 'ens5f0np0']
                pfNames: ['ens5f0np0#0-7']
              deviceType: netdevice
              isRdma: True

      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovrightmlx
            spec:
              resourceName: "sriovrightmlx"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: 9000
              numVfs: 24
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f1np1', 'ens5f1np1']
                pfNames: ['ens5f1np1#0-7']
              deviceType: netdevice
              isRdma: True

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-mlx-one"
            spec:
              capabilities: '{ "ips": true }'
              ipam: '{}'
              linkState: auto
              networkNamespace: rds-sriov-wlkd
              resourceName: sriovleftmlx
              trust: "on"

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-mlx-two"
            spec:
              capabilities: '{ "ips": true }'
              ipam: '{}'
              linkState: auto
              networkNamespace: rds-sriov-wlkd
              resourceName: sriovrightmlx
              trust: "on"

      #
      # Create VFs on the Mellanox-NICs for pod level bonding
      #
      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovleftmlxbond
            spec:
              resourceName: "sriovleftmlxbond"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: 9000
              numVfs: 24
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                pfNames: ['ens5f0np0#8-15']
              deviceType: netdevice
              isRdma: True

      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovrightmlxbond
            spec:
              resourceName: "sriovrightmlxbond"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: 9000
              numVfs: 24
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f1np1', 'ens5f1np1']
                pfNames: ['ens5f1np1#8-15']
              deviceType: netdevice
              isRdma: True

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-mlx-one-bond"
            spec:
              capabilities: '{ "ips": true }'
              ipam: '{}'
              linkState: auto
              networkNamespace: rds-bonded-sriov-wlkd
              resourceName: sriovleftmlxbond
              trust: "off"
              vlan: 497

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-mlx-two-bond"
            spec:
              capabilities: '{ "ips": true }'
              ipam: '{}'
              linkState: auto
              networkNamespace: rds-bonded-sriov-wlkd
              resourceName: sriovrightmlxbond
              trust: "off"
              vlan: 497

      #
      # SR-IOV for Rootless DPDK
      #
      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovleftmlxrootless
            spec:
              resourceName: "sriovleftmlxrootless"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: '{{hub fromConfigMap "" "sriov-config" "sriov-nnp-mlx-left-rootless-mtu" | toInt hub}}'
              numVfs: '{{hub fromConfigMap "" "sriov-config" "sriov-nnp-mlx-left-num-rootless-vfs" | toInt hub}}'
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f0np0', 'ens5f0np0']
                pfNames:
                - '{{hub fromConfigMap "" "sriov-config" "sriov-mlx-left-nic-1-rootless" | toLiteral hub}}'
              deviceType: netdevice
              isRdma: True
              needVhostNet: True

      - path: source-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
          - metadata:
              name: sriovrightmlxrootless
            spec:
              resourceName: "sriovrightmlxrootless"
              nodeSelector:
                node-role.kubernetes.io/customcnf: ""
              mtu: '{{hub fromConfigMap "" "sriov-config" "sriov-nnp-mlx-right-rootless-mtu" | toInt hub}}'
              numVfs: '{{hub fromConfigMap "" "sriov-config" "sriov-nnp-mlx-right-num-rootless-vfs" | toInt hub}}'
              priority: 99
              nicSelector:
                # consider switching to PCI paths
                # pfNames: ['ens4f1np1', 'ens5f1np1']
                pfNames:
                - '{{hub fromConfigMap "" "sriov-config" "sriov-mlx-right-nic-1-rootless" | toLiteral hub}}'
              deviceType: netdevice
              isRdma: True
              needVhostNet: False

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-mlx-rootless-dpdk-one"
            spec:
              capabilities: '{ "mac": true, "ips": true }'
              ipam: '{"type": "host-local","ranges": [[{"subnet": "10.46.126.192/26", "rangeStart":"10.46.126.210", "rangeEnd":"10.46.126.215"}]],"dataDir": "/run/my-orchestrator/container-ipam-state"}'
              linkState: auto
              networkNamespace: rds-rootless-dpdk-wlkd
              resourceName: sriovleftmlxrootless
              trust: "on"

      - path: source-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
          - metadata:
              name: "sriov-mlx-rootless-dpdk-two"
            spec:
              capabilities: '{ "mac": true, "ips": true }'
              ipam: '{"type": "host-local","ranges": [[{"subnet": "10.46.126.192/26", "rangeStart":"10.46.126.216", "rangeEnd":"10.46.126.220"}]],"dataDir": "/run/my-orchestrator/container-ipam-state"}'
              linkState: auto
              networkNamespace: rds-rootless-dpdk-wlkd
              resourceName: sriovrightmlxrootless
              trust: "on"
              vlan: 499

      # Configure ODF
      #
      - path: source-crs/required/storage/odf-external/01-rook-ceph-external-cluster-details.secret.yaml
        patches:
          - data:
              external_cluster_details: 

      - path: source-crs/required/storage/odf-external/02-ocs-external-storagecluster.yaml

  - name: config-monitoring-4.22
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "10"
    manifests:
      - path: source-crs/optional/other/monitoring-config-cm.yaml
        complianceType: musthave
        # TODO(yprokule): check additionalAlertmanagerConfigs configuration
        #               : this also should be configured after StorageClassed from ODF are available
        patches:
        - data:
            config.yaml: |
              prometheusK8s:
                retention: 1d
                volumeClaimTemplate:
                  spec:
                    storageClassName: ocs-external-storagecluster-ceph-rbd
                    resources:
                      requests:
                        storage: 10Gi
              alertmanagerMain:
                volumeClaimTemplate:
                  spec:
                    storageClassName: ocs-external-storagecluster-ceph-rbd
                    resources:
                      requests:
                        storage: 20Gi
