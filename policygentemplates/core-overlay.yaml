                {"range":"fd12:2222:3333:5588::30/124"}]}} ]}'
              type: Raw



      - path: source-crs/required/scheduling/nrop.yaml
        patches:
        - spec:
            nodeGroups:
              - config:
                  # Periodic is the default setting
                  infoRefreshMode: Periodic
                machineConfigPoolSelector:
                  matchLabels:
                    # This label must match the pool(s) you want to run NUMA-aligned workloads
                    pools.operator.machineconfiguration.openshift.io/customcnf: ""

      - path: source-crs/required/performance/PerformanceProfile.yaml
        complianceType: mustonlyhave
        patches:
          - metadata:
              name: customcnf
            spec:
              cpu:
                isolated: '{{hub fromConfigMap "" "hw-types" (printf "%s-cnf-isolated-cpu" .ManagedClusterName) | toLiteral hub}}'
                reserved: '{{hub fromConfigMap "" "hw-types" (printf "%s-cnf-reserved-cpu" .ManagedClusterName) | toLiteral hub}}'
              hugepages:
                defaultHugepagesSize: 1G
                # TODO(yprokule): update to use hub side templating
                pages:
                - size: 1G
                  count: 6
                  node: 0
                - size: 1G
                  count: 6
                  node: 1
              machineConfigPoolSelector:
                $patch: replace
                pools.operator.machineconfiguration.openshift.io/customcnf: ""
              nodeSelector:
                $patch: replace
                node-role.kubernetes.io/customcnf: ""

      - path: source-crs/required/performance/TunedPerformancePatch.yaml
        patches:
        - metadata:
            name: custom-telco-core-performance-patch
          spec:
            profile:
              - name: qe-control-plane-profile
                data: |
                  [main]
                  summary=Custom control plane performance tuning overrides
                  include=openshift-control-plane
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
              - name: qe-customcnf-profile
                data: |
                  [main]
                  summary=Custom compute core performance tuning overrides
                  include=openshift-node-performance-customcnf
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
              - name: qe-standard-profile
                data: |
                  [main]
                  summary=Custom compute core performance tuning overrides
                  include=openshift-node
                  [sysctl]
                  kernel.panic_on_unrecovered_nmi=1
            recommend:
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: master
                priority: 18
                profile: qe-control-plane-profile
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: customcnf
                priority: 18
                profile: qe-customcnf-profile
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: standard
                priority: 18
                profile: qe-standard-profile

      - path: source-crs/optional/logging/ClusterLogForwarder.yaml
        patches:
        - spec:
            outputs:
            - type: "kafka"
              name: kafka-open
              kafka:
                # use FQDN when DNS entries for IPv4 and IPv6 are in place
                # only IPv4 IP address works
                #  url: tcp://vran-qe-kafka.lab.eng.rdu2.redhat.com:9092/vran-qe
                #url: tcp://vran-qe-kafka.kni-qe-11.lab.eng.rdu2.redhat.com:9092/vran-qe
                url: '{{hub fromConfigMap "" "regional" (printf "%s-log-url" (index .ManagedClusterLabels "zone")) | toLiteral hub}}'
            filters:
            - name: custom-labels
              type: openshiftLabels
              openshiftLabels:
                sitename: '{{hub fromConfigMap "" "regional" (printf "%s-logging-name" .ManagedClusterName) | toLiteral hub}}'
                siteuuid: '{{hub fromConfigMap "" "regional" (printf "%s-logging-uuid" .ManagedClusterName) | toLiteral hub}}'
                rds: core
            pipelines:
            - name: all-to-default
              inputRefs:
              - audit
              - infrastructure
              filterRefs:
              - custom-labels
              outputRefs:
              - kafka-open

