  # Custom networking, operator and cluster configuration
  - name: core-overlay-config-4.22
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "8"
    manifests:
      # Set auto sizing of control plane nodes
      - path: source-crs/optional/tuning/control-plane-system-reserved.yaml
      - path: source-crs/required/networking/Network.yaml
        patches:
        - spec:
            defaultNetwork:
              ovnKubernetesConfig:
                mtu: 8900
                gatewayConfig:
                  routingViaHost: true
                egressIPConfig:
                  reachabilityTotalTimeoutSeconds: 1
            additionalNetworks:
            - name: mc-vlan-one
              namespace: rds-macvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "mc-vlan-one", "plugins": [{"type": "macvlan", "master": "bond0.3001", "ipam": {}}] }'
              type: Raw
            - name: mc-vlan-two
              namespace: rds-macvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "mc-vlan-two", "plugins": [{"type": "macvlan", "master": "bond0.3001", "mode": "private" }]}'
              type: Raw
            - name: ipvlan-one
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-one", "type":"ipvlan", "master":"bond0.3004", "ipam":{"type":"static", "addresses":[{"address":"192.168.34.30/24"}, {"address":"fd55:5555:4444:3333:2222:1111:0:30/96"}]}}'
              type: Raw
            - name: ipvlan-two
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-two", "type":"ipvlan", "master":"bond0.3004", "ipam":{"type":"static", "addresses":[{"address":"192.168.34.31/24"}, {"address":"fd55:5555:4444:3333:2222:1111:0:31/96"}]}}'
              type: Raw
            - name: ipvlan-three
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-three", "type":"ipvlan", "master":"bond0.3004", "ipam":{"type":"static", "addresses":[{"address":"192.168.34.32/24"}, {"address":"fd55:5555:4444:3333:2222:1111:0:32/96"}]}}'
              type: Raw
            - name: ipvlan-four
              namespace: rds-ipvlan-wlkd
              rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "ipvlan-four", "type":"ipvlan", "master":"bond0.3004", "ipam":{"type":"static", "addresses":[{"address":"192.168.34.33/24"}, {"address":"fd55:5555:4444:3333:2222:1111:0:33/96"}]}}'
              type: Raw
            - name: rds-whereabouts-one
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-one", "plugins":[{"type":"macvlan",
                "master":"bond0.3005", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.0/30"},
                {"range":"fd12:2222:3333:5588::0/124"}]}} ]}'
              type: Raw
            - name: rds-whereabouts-two
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-two", "plugins":[{"type":"macvlan",
                "master":"bond0.3005", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.4/30"},
                {"range":"fd12:2222:3333:5588::10/124"}]}} ]}'
              type: Raw
            - name: rds-whereabouts-st-one
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-st-one", "plugins":[{"type":"macvlan",
                "master":"bond0.3005", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.8/30"},
                {"range":"fd12:2222:3333:5588::20/124"}]}} ]}'
              type: Raw
            - name: rds-whereabouts-st-two
              namespace: rds-whereabouts
              rawCNIConfig: '{"cniVersion": "0.4.0", "name": "rds-whereabouts-st-two", "plugins":[{"type":"macvlan",
                "master":"bond0.3005", "ipam":{"type":"whereabouts", "ipRanges":[{"range":"192.200.50.12/30"},
                {"range":"fd12:2222:3333:5588::30/124"}]}} ]}'
              type: Raw

      - path: source-crs/required/scheduling/nrop.yaml
        patches:
        - spec:
            nodeGroups:
              - config:
                  # Periodic is the default setting
                  infoRefreshMode: Periodic
                machineConfigPoolSelector:
                  matchLabels:
                    # This label must match the pool(s) you want to run NUMA-aligned workloads
                    pools.operator.machineconfiguration.openshift.io/amd-turin: ""
              - config:
                  # Periodic is the default setting
                  infoRefreshMode: Periodic
                machineConfigPoolSelector:
                  matchLabels:
                    # This label must match the pool(s) you want to run NUMA-aligned workloads
                    pools.operator.machineconfiguration.openshift.io/intel-sierra: ""

