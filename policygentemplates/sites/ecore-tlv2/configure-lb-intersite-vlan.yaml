---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "day2-net-intersite"
  namespace: "ztp-site"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    - fileName: required/networking/nodeNetworkConfigurationPolicy.yaml
      policyName: "add-lb-intersite-vlan"
      metadata:
        name: for-master-0-intersite
        annotations:
          ran.openshift.io/ztp-deploy-wave: "10"
      spec:
        nodeSelector:
          kubernetes.io/hostname: "openshift-master-0.ecore.lab.eng.tlv2.redhat.com"
        desiredState:
          routes:
            config: []
          interfaces:
            - name: bond0.357
              description: "This is lb-signaling VLAN"
              type: vlan
              state: up
              ipv4:
                enabled: true
                address:
                - ip: 10.46.187.200
                  prefix-length: 26
                dhcp: false
                auto-dns: false
              ipv6:
                enabled: false
                dhcp: false
                auto-dns: false
              vlan:
                base-iface: bond0
                id: 357
    # master-0 end ^^^
