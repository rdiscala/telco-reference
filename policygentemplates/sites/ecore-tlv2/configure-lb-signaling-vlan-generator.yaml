---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: telco-lb-signaling
policyDefaults:
  namespace: ztp-site
  policySets: []
  placement:
    labelSelector:
      matchExpressions:
        - key: site
          operator: In
          values:
            - "ecore"
        - key: zone
          operator: In
          values:
            - tlv2
  remediationAction: "inform"
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "10"
policies:
  - name: add-lb-signaling-vlan
    manifests:
      - path: source-crs/required/networking/nodeNetworkConfigurationPolicy.yaml
        patches:
          - metadata:
              name: for-master-0-signaling
            spec:
              nodeSelector:
                $patch: replace
                kubernetes.io/hostname: "openshift-master-0.ecore.lab.eng.tlv2.redhat.com"
              desiredState:
                routes:
                  $patch: replace
                  config: []
                interfaces:
                  - name: bond0.356
                    description: "This is lb-signaling VLAN"
                    type: vlan
                    state: up
                    ipv4:
                      enabled: true
                      address:
                        - ip: 10.46.187.130
                          prefix-length: 26
                      dhcp: false
                      auto-dns: false
                    ipv6:
                      enabled: true
                      address:
                        - ip: 2620:52:0:2ebb::90
                          prefix-length: 122
                      dhcp: false
                      auto-dns: false
                    vlan:
                      base-iface: bond0
                      id: 356
      # master-0 ^^^

      - path: source-crs/required/networking/nodeNetworkConfigurationPolicy.yaml
