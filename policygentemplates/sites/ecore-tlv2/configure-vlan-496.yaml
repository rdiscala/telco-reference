---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: telco-lb-496
policyDefaults:
  namespace: ztp-site
  policySets: []
  placement:
    labelSelector:
      matchExpressions:
        - key: site
          operator: In
          values:
            - "ecore"
        - key: zone
          operator: In
          values:
            - tlv2
  remediationAction: "inform"
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "10"
policies:
  - name: add-ocp-pc-up-media-vlan
    manifests:
      - path: source-crs/required/networking/nodeNetworkConfigurationPolicy.yaml
        patches:
          - metadata:
              name: for-worker-0-496
            spec:
              nodeSelector:
                $patch: replace
                kubernetes.io/hostname: "openshift-worker-0.ecore.lab.eng.tlv2.redhat.com"
              desiredState:
                routes:
                  $patch: replace
                  config: []
                interfaces:
                  - name: bond0.496
                    description: "This is ocp-pc-up-media VLAN"
                    type: vlan
                    state: up
                    ipv4:
                      enabled: true
                      address:
                        - ip: 10.46.126.15
                          prefix-length: 26
                      dhcp: false
                      auto-dns: false
                    ipv6:
                      enabled: true
                      address:
                        - ip: 2620:0052:0000:2e7e::0015
                          prefix-length: 122
                      dhcp: false
                      auto-dns: false
                    vlan:
                      base-iface: bond0
                      id: 496
      # worker-0 ^^^

      - path: source-crs/required/networking/nodeNetworkConfigurationPolicy.yaml
