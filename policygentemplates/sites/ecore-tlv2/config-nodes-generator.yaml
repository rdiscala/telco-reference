apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: telco-config-nodes
policyDefaults:
  namespace: ztp-site
  policySets: []
  placement:
    labelSelector:
      matchExpressions:
        - key: site
          operator: In
          values:
            - "ecore"
        - key: zone
          operator: In
          values:
            - tlv2
  remediationAction: "inform"
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "4"
policies:
  - name: config-mc
    manifests:
      - path: source-crs/MachineConfigGeneric.yaml
        patches:
          - metadata:
              name: 98-master-etc-chrony-conf
              $patch: replace
              labels:
                machineconfiguration.openshift.io/role: master
            spec:
              config:
                # Release info found in https://github.com/coreos/butane/releases
                ignition:
                  version: 3.2.0
                storage:
                  files:
                  - contents:
                      source: data:text/plain;charset=utf-8;base64,
                      verification: {}
                    filesystem: root
                    group:
                      name: root
                    mode: 420
                    path: /etc/chrony.conf
                    user:
                      name: root

      - path: source-crs/MachineConfigGeneric.yaml
        patches:
          - metadata:
              name: 98-worker-etc-chrony-conf
              $patch: replace
              labels:
                machineconfiguration.openshift.io/role: worker
            spec:
              config:
                # Release info found in https://github.com/coreos/butane/releases
                ignition:
                  version: 3.2.0
                storage:
                  files:
                  - contents:
                      source: data:text/plain;charset=utf-8;base64,
                      verification: {}
                    filesystem: root
                    group:
                      name: root
                    mode: 420
                    path: /etc/chrony.conf
                    user:
                      name: root

      - path: source-crs/MachineConfigGeneric.yaml
        patches:
          - metadata:
              name: set-core-user-password-cp
              $patch: replace
              labels:
                machineconfiguration.openshift.io/role: master
            spec:
              config:
                # Release info found in https://github.com/coreos/butane/releases
                ignition:
                  version: 3.2.0
                passwd:
                  users:
                  - name: core
                    passwordHash: $6$jSbZxPaKvavx6yLk$hq24RYtkVcXCbs.qXt/n/szot/Fi0Yo9nDoNnQEzDwlLkpz9dRZE6JjL6PcNpLaFp0/QsGKRPCc6dHVyL25kr0

      - path: source-crs/MachineConfigGeneric.yaml
        patches:
          - metadata:
              name: set-core-user-password-compute
              $patch: replace
              labels:
                machineconfiguration.openshift.io/role: worker
            spec:
              config:
                # Release info found in https://github.com/coreos/butane/releases
                ignition:
                  version: 3.2.0
                passwd:
                  users:
                  - name: core
                    passwordHash: $6$jSbZxPaKvavx6yLk$hq24RYtkVcXCbs.qXt/n/szot/Fi0Yo9nDoNnQEzDwlLkpz9dRZE6JjL6PcNpLaFp0/QsGKRPCc6dHVyL25kr0

