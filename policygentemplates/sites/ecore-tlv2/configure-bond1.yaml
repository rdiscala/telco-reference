---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "day2-bond1"
  namespace: "ztp-site"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    # openshift-master-0
    - fileName: nmstate/nodeNetworkConfigurationPolicy.yaml
      policyName: "add-bond1-macvlan"
      metadata:
        name: openshift-master-0-bond1-macvlan
      annotations:
        ran.openshift.io/ztp-deploy-wave: "10"
      spec:
        nodeSelector:
          kubernetes.io/hostname: "openshift-master-0.ecore.lab.eng.tlv2.redhat.com"
        desiredState:
          interfaces:
            - name: bond1
              description: "Bond interface for MACVLAN"
              type: bond
              state: up
              mtu: 9000
              accept-all-mac-addresses: true
              ipv4:
                enabled: false
              ipv6:
                enabled: false
              link-aggregation:
                mode: 802.3ad
                options:
                  miimon: 100
                  lacp_rate: slow
                port:
                - ens2f0
                - ens2f1
    # openshift-master-1
    - fileName: nmstate/nodeNetworkConfigurationPolicy.yaml
      policyName: "add-bond1-macvlan"
      metadata:
        name: openshift-master-1-bond1-macvlan
