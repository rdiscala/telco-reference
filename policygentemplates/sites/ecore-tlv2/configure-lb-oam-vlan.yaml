      metadata:
        name: for-master-0-oam
        annotations:
          ran.openshift.io/ztp-deploy-wave: "10"
      spec:
        nodeSelector:
          kubernetes.io/hostname: "openshift-master-0.ecore.lab.eng.tlv2.redhat.com"
        desiredState:
          routes:
            config: []
          interfaces:
            - name: bond0.358
              description: "This is lb-oam VLAN"
              type: vlan
              state: up
              ipv4:
                enabled: true
                address:
                - ip: 10.46.188.5
                  prefix-length: 26
                dhcp: false
                auto-dns: false
              ipv6:
                enabled: true
                address:
                - ip: 2620:0052:0000:2ebc::0010
                  prefix-length: 122
                dhcp: false
                auto-dns: false
              vlan:
                base-iface: bond0
                id: 358
