apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: telco-day2-bond1
policyDefaults:
  namespace: ztp-site
  policySets: []
  placement:
    labelSelector:
      matchExpressions:
        - key: site
          operator: In
          values:
            - "ecore"
        - key: zone
          operator: In
          values:
            - tlv2
  remediationAction: "inform"
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "10"
policies:
  - name: add-bond1-macvlan
    manifests:
      - path: source-crs/required/networking/nodeNetworkConfigurationPolicy.yaml
        patches:
          - metadata:
              name: openshift-master-0-bond1-macvlan
            spec:
              nodeSelector:
                $patch: replace
                kubernetes.io/hostname: "openshift-master-0.ecore.lab.eng.tlv2.redhat.com"
              desiredState:
                routes:
                  $patch: replace
                  config: []
                interfaces:
                  - name: bond1
                    description: "Bond interface for MACVLAN"
                    type: bond
                    state: up
                    mtu: 9000
                    accept-all-mac-addresses: true
                    ipv4:
                      enabled: false
                    ipv6:
                      enabled: false
                    link-aggregation:
                      mode: 802.3ad
                      options:
                        miimon: 100
                        lacp_rate: slow
                      port:
                      - ens2f0
                      - ens2f1
      # master-0 ^^^

      - path: source-crs/required/networking/nodeNetworkConfigurationPolicy.yaml
        patches:
          - metadata:
              name: openshift-master-1-bond1-macvlan
            spec:
              nodeSelector:
                $patch: replace
                kubernetes.io/hostname: "openshift-master-1.ecore.lab.eng.tlv2.redhat.com"
              desiredState:
