---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "config-masters"
  namespace: "ztp-site"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  sourceFiles:
    - fileName: required/scheduling/Scheduler.yaml
      policyName: "config-cluster"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "10"
      spec:
        mastersSchedulable: false

