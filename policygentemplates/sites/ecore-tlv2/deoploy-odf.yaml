---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "odf-storage-tlv2"
  namespace: "ztp-site"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    # install ODF operator
    - fileName: required/storage/odf-external/odfNS.yaml
      policyName: "install-odf-operator"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "8"
    - fileName: required/storage/odf-external/odfOperGroup.yaml
      policyName: "install-odf-operator"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "8"
    - fileName: required/storage/odf-external/odfSubscription.yaml
      policyName: "install-odf-operator"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "8"
      spec:
        channel: "stable-4.16"
    # configure ODF operator
    - fileName: required/storage/odf-external/01-rook-ceph-external-cluster-details.secret.yaml
      policyName: "config-odf-operator"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "11"
      data:
        external_cluster_details: 
    - fileName: required/storage/odf-external/02-ocs-external-storagecluster.yaml
      policyName: "config-odf-operator"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "11"
    # storage classes from ODF
    # NOT PRESENT in CORE Container
    # - fileName: required/storage/odf-external/odf-sc-ceph-rbd.yaml
    #   policyName: "odf-storage-classes"
    # - fileName: required/storage/odf-external/odf-sc-ceph-fs.yaml
    #   policyName: "odf-storage-classes"
    # - fileName: required/storage/odf-external/odf-sc-nooba.yaml
    #   policyName: "odf-storage-classes"
