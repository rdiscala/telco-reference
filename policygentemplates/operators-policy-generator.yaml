apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: telco-core-operators
policyDefaults:
  namespace: ztp-common
  policySets: []
  placement:
    labelSelector:
      matchExpressions:
        - key: site
          operator: In
          values:
            - "ecore"
        - key: zone
          operator: In
          values:
            - tlv2
        - key: version
          operator: In
          values:
            - "4.17"
        - key: yp-ztp-update
          operator: DoesNotExist
  remediationAction: "inform"
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "2"
policies:
  - name: config-catsrc
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "1"
    manifests:
      - path: source-crs/required/other/catalog-source.yaml
        patches:
          - metadata:
              name: redhat-operators-disconnected
            spec:
              displayName: Red Hat Disconnected Operators Catalog
              image: registry.ecore.lab.eng.tlv2.redhat.com:5000/olm/redhat-operators:v4.17
              publisher: Red Hat
              sourceType: grpc
  - name: install-operators
    manifests:
      #
      # Install SR-IOV
      #
      - path: source-crs/required/networking/sriov/SriovSubscriptionNS.yaml
      - path: source-crs/required/networking/sriov/SriovSubscriptionOperGroup.yaml
      - path: source-crs/required/networking/sriov/SriovSubscription.yaml
        patches:
          - spec:
              channel: "stable"
              source: redhat-operators-disconnected
              installPlanApproval: "Automatic"
      #
      # Install MetalLB
      #
      - path: source-crs/required/networking/metallb/metallbNS.yaml
      - path: source-crs/required/networking/metallb/metallbOperGroup.yaml
      - path: source-crs/required/networking/metallb/metallbSubscription.yaml
        patches:
          - spec:
              channel: "stable"
              source: redhat-operators-disconnected
              installPlanApproval: "Automatic"
      #
      # Install NROP
      #
      - path: source-crs/required/scheduling/NROPSubscriptionNS.yaml
      - path: source-crs/required/scheduling/NROPSubscriptionOperGroup.yaml
      - path: source-crs/required/scheduling/NROPSubscription.yaml
        patches:
          - spec:
              channel: "4.17"
              source: redhat-operators-disconnected
              installPlanApproval: "Automatic"
      #
      # Install NMState
      #
      - path: source-crs/required/networking/NMStateNS.yaml
      - path: source-crs/required/networking/NMStateOperGroup.yaml
      - path: source-crs/required/networking/NMStateSubscription.yaml
        patches:
          - spec:
              channel: "stable"
              source: redhat-operators-disconnected
              installPlanApproval: Automatic
      #
      # Install ClusterLogging
      #
      #- path: source-crs/optional/logging/ClusterLogNS.yaml
      #- path: source-crs/optional/logging/ClusterLogOperGroup.yaml
      #- path: source-crs/optional/logging/ClusterLogSubscription.yaml
      #  patches:
      #    - spec:
      #        source: redhat-operators-disconnected
      #        installPlanApproval: Automatic
      #
      # Install ODF
      #
      - path: source-crs/required/storage/odf-external/odfNS.yaml
      - path: source-crs/required/storage/odf-external/odfOperGroup.yaml
      - path: source-crs/required/storage/odf-external/odfSubscription.yaml
        patches:
          - spec:
              channel: "stable-4.17"
              source: redhat-operators-disconnected
              installPlanApproval: Automatic
