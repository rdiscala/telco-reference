# AllNamespaces install mode (no targetNamespaces). Required because the
# Loki Operator manages LokiStack CRs in other namespaces (e.g. openshift-logging).
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    operatorframework.io/bundle-unpack-min-retry-interval: 10m
spec:
  upgradeStrategy: Default
