---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "common"
  namespace: "ztp-common"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    - fileName: required/networking/Network.yaml
      policyName: "config-network"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            mtu: 8900
            gatewayConfig:
              ipForwarding: "Global"
              routingViaHost: true
        additionalNetworks:
        - name: mc-vlan-one
          namespace: rds-macvlan-wlkd
          rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "mc-vlan-one", "plugins": [{"type": "macvlan", "master": "bond1", "ipam": {}}] }'
          type: Raw
        - name: mc-vlan-two
          namespace: rds-macvlan-wlkd
          rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "mc-vlan-two", "plugins": [{"type": "macvlan", "master": "bond1", "mode": "private" }]}'
          type: Raw

    - fileName: required/other/operator-hub.yaml
      policyName: "config-policy"
      complianceType: mustonlyhave
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"

    #
    # configure ICSP
    #
    - fileName: required/other/icsp.yaml
      policyName: "config-policy"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"
      spec:
        repositoryDigestMirrors:
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
            source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
            source: registry.ci.openshift.org/ocp/release
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry.redhat.io
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry-proxy.engineering.redhat.com
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry.stage.redhat.io
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-qe-optional-operators
            source: quay.io/openshift-qe-optional-operators
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshifttest
            source: quay.io/openshifttest
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/rh-nfv-int
            source: quay.io/rh-nfv-int
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/intel
            source: registry.connect.redhat.com/intel
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-release-nightly
            source: quay.io/openshift-release-dev/ocp-release-nightly
    #
    # configure SR-IOV operator
    #
    - fileName: required/networking/sriov/SriovOperatorConfig.yaml
      policyName: "config-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"
    #
    # install and configure NROP
    #
    - fileName: required/scheduling/nrop.yaml
      policyName: "config-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"
      spec:
        nodeGroups:
        - machineConfigPoolSelector:
            matchLabels:
              # This label must match the pool(s) you want to run NUMA-aligned workloads
              pools.operator.machineconfiguration.openshift.io/customcnf: ""
    - fileName: required/scheduling/sched.yaml
      policyName: "config-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"
      spec:
        #cacheResyncPeriod: "0"
        # Image spec should be the latest for the release
        imageSpec: "registry.ecore.lab.eng.tlv2.redhat.com:5000/nrop/noderesourcetopology-scheduler-rhel9:v4.17.0"
    #
    # initialize NMState operator
    #
    - fileName: required/networking/NMState.yaml
      policyName: "config-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"

    #
    # install and configure Logging
    #
    #- fileName: optional/logging/ClusterLogging.yaml
    #  policyName: "config-operators"
    #  metadata:
    #    annotations:
    #      ran.openshift.io/ztp-deploy-wave: "3"
    # NOTE(yprokule): ClusterLogForwarder.yaml has to be added
    #               : after central server for logs is available
    #               : trying to use same wave
    #- fileName: optional/logging/ClusterLogForwarder.yaml
    #  policyName: "config-operators"
    #  metadata:
    #    annotations:
    #      ran.openshift.io/ztp-deploy-wave: "3"
    #  spec:
    #    outputs:
    #      - type: "kafka"
    #        name: kafka-open
    #        # use FQDN when DNS entries for IPv4 and IPv6 are in place
    #        # only IPv4 IP address works
    #        #  url: tcp://vran-qe-kafka.lab.eng.rdu2.redhat.com:9092/vran-qe
    #        url: tcp://vran-qe-kafka.kni-qe-11.lab.eng.rdu2.redhat.com:9092/vran-qe
    #    pipelines:
    #      - inputRefs:
    #          - audit
    #          - infrastructure
    #        labels:
    #          label1: test1
    #          label2: test2
    #          label3: test3
    #          rds: core
    #        name: all-to-default
    #        outputRefs:
    #          - kafka-open
    #
    # configure Monitoring
    #
    - fileName: optional/other/monitoring-config-cm.yaml
      policyName: "config-operators"
      metadata:
        name: cluster-monitoring-config
        namespace: openshift-monitoring
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"
      data:
        config.yaml: |
          prometheusK8s:
            retention: 1d
            volumeClaimTemplate:
              spec:
                storageClassName: ocs-external-storagecluster-ceph-rbd
                resources:
                  requests:
                    storage: 10Gi
          alertmanagerMain:
            volumeClaimTemplate:
              spec:
                storageClassName: ocs-external-storagecluster-ceph-rbd
                resources:
                  requests:
                    storage: 20Gi
    # configure custom Namespaces
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-macvlan-wlkd
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-sriov-wlkd
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-nrop-wlkd
    #
    # Configuration for Rootless Pods(fromRDS)
    #
    - fileName: optional/networking/multus/tap_cni/mc_rootless_pods_selinux.yaml
      policyName: "config-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"

    #
    # Enable KDump
    #
    - fileName: optional/other/06-kdump-master.yaml
      policyName: enable-kdump
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"

    - fileName: optional/other/06-kdump-worker.yaml
      policyName: enable-kdump
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "3"

    #
    # configure MachineConfigPool customcnf moved to extra-manifests
    #
    - fileName: MachineConfigPool.yaml
      policyName: config-nodes-mcp
      metadata:
        name: customcnf
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
        labels:
          machineconfiguration.openshift.io/role: customcnf
          pools.operator.machineconfiguration.openshift.io/customcnf: ""
      spec:
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values: [worker, customcnf]
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/customcnf: ""

    - fileName: MachineConfigPool.yaml
      policyName: config-nodes-mcp
      metadata:
        name: standard
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
        labels:
          machineconfiguration.openshift.io/role: standard
          pools.operator.machineconfiguration.openshift.io/standard: ""
      spec:
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values: [worker, standard]
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/standard: ""
