---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "common"
  namespace: "ztp-common"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    - fileName: OperatorHub.yaml
      policyName: "disable-operator-hub"
    - fileName: DefaultCatsrc.yaml
      policyName: "config-policy"
      metadata:
          name: redhat-operators-disconnected
      spec:
        displayName: Red Hat Operators Catalog
        image: registry.ecore.lab.eng.tlv2.redhat.com:5000/olm/redhat-operators:v4.14
    - fileName: MachineConfigPool.yaml
      policyName: "config-policy"
      metadata:
        name: ht100gb
        labels:
          machineconfiguration.openshift.io/role: ht100gb
      spec:
        maxUnavailable: 1
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values:
                - worker
                - ht100gb
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/ht100gb: ""
        paused: false
    - fileName: MachineConfigPool.yaml
      policyName: "config-policy"
      metadata:
        name: standard
        labels:
          machineconfiguration.openshift.io/role: standard
      spec:
        maxUnavailable: "90%"
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values:
                - worker
                - standard
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/standard: ""
        paused: false
