---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "common"
  namespace: "ztp-common"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    - fileName: RoutingViaHost.yaml
      policyName: "config-network"
    - fileName: OperatorHub.yaml
      policyName: "disable-operator-hub"
    - fileName: DefaultCatsrc.yaml
      policyName: "config-policy"
      metadata:
          name: redhat-operators-disconnected
      spec:
        displayName: Red Hat Disconnected Operators Catalog
        image: registry.ecore.lab.eng.tlv2.redhat.com:5000/olm/redhat-operators:v4.15
        publisher: Red Hat
        sourceType: grpc
    #
    # Dedicated CatalogSource for 4.15 ODF operator
    #
    - fileName: DefaultCatsrc.yaml
      policyName: "config-policy"
      metadata:
          name: redhat-odf-disconnected
      spec:
        displayName: Red Hat ODF Disconnected Operators Catalog
        image: registry.ecore.lab.eng.tlv2.redhat.com:5000/olm/redhat-operators-odf:v4.15
        publisher: Red Hat
        sourceType: grpc
    #
    # configure ICSP
    #
    - fileName: DisconnectedICSP.yaml
      policyName: "config-policy"
      spec:
        repositoryDigestMirrors:
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
            source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
            source: registry.ci.openshift.org/ocp/release
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry.redhat.io
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry-proxy.engineering.redhat.com
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry.stage.redhat.io
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-qe-optional-operators
            source: quay.io/openshift-qe-optional-operators
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshifttest
            source: quay.io/openshifttest
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/rh-nfv-int
            source: quay.io/rh-nfv-int
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/intel
            source: registry.connect.redhat.com/intel
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-release-nightly
            source: quay.io/openshift-release-dev/ocp-release-nightly
    #
    # install and configure SR-IOV operator
    #
    - fileName: SriovSubscriptionNS.yaml
      policyName: "install-operators-sriov"
    - fileName: SriovSubscriptionOperGroup.yaml
      policyName: "install-operators-sriov"
    - fileName: SriovSubscription.yaml
      policyName: "install-operators-sriov"
      spec:
        channel: "stable"
        source: redhat-operators-disconnected
        installPlanApproval: "Automatic"
    - fileName: SriovOperatorConfig.yaml
      policyName: "config-operators-sriov"
      spec:
        configDaemonNodeSelector:
          node-role.kubernetes.io/worker: ""
    #
    # install and configure MetalLB operator
    # MetalLB operator configuration moved to a site folder
    #
    - fileName: metallb/ns.yaml
      policyName: "install-operators"
    - fileName: metallb/operatorGroup.yaml
      policyName: "install-operators"
    - fileName: metallb/subscription.yaml
      policyName: "install-operators"
      spec:
        channel: "stable"
        source: redhat-operators-disconnected
        installPlanApproval: "Automatic"
    #
    # install and configure NROP
    #
    - fileName: scheduling/NROPSubscriptionNS.yaml
      policyName: "install-operators"
    - fileName: scheduling/NROPSubscriptionOperGroup.yaml
      policyName: "install-operators"
    - fileName: scheduling/NROPSubscription.yaml
      policyName: "install-operators"
    - fileName: scheduling/nrop.yaml
      policyName: "install-operators"
    - fileName: scheduling/nrop-scheduling.yaml
      policyName: "install-operators"
      spec:
        #cacheResyncPeriod: "0"
        # Image spec should be the latest for the release
        imageSpec: "registry.ecore.lab.eng.tlv2.redhat.com:5000/nrop/noderesourcetopology-scheduler-rhel9:v4.15.0"
    #
    # install NMState operator
    #
    - fileName: nmstate/namespace.yaml
      policyName: "install-operators"
    - fileName: nmstate/operatorGroup.yaml
      policyName: "install-operators"
    - fileName: nmstate/subscription.yaml
      policyName: "install-operators"
    - fileName: nmstate/instance.yaml
      policyName: "install-operators"
    #
    # install and configure Logging
    #
    - fileName: ClusterLogNS.yaml
      policyName: "cluster-logging-op"
    - fileName: ClusterLogOperGroup.yaml
      policyName: "cluster-logging-op"
    - fileName: ClusterLogSubscription.yaml
      policyName: "cluster-logging-op"
      spec:
        source: redhat-operators-disconnected
        installPlanApproval: Automatic
    # NOTE(yprokule): ClusterLogging instance by default uses wave 10
    #               : thefore dedicated policy
    - fileName: ClusterLogging.yaml
      policyName: "cluster-logging-configure"
    # NOTE(yprokule): ClusterLogForwarder.yaml has to be added
    #               : after central server for logs is available
    - fileName: ClusterLogForwarder.yaml
      policyName: "config-policy-configure"
      spec:
        outputs:
          - type: "kafka"
            name: kafka-open
            # use FQDN when DNS entries for IPv4 and IPv6 are in place
            # only IPv4 IP address works
            #  url: tcp://vran-qe-kafka.lab.eng.rdu2.redhat.com:9092/vran-qe
            url: tcp://vran-qe-kafka.kni-qe-11.lab.eng.rdu2.redhat.com:9092/vran-qe
        pipelines:
          - inputRefs:
              - audit
              - infrastructure
            labels:
              label1: test1
              label2: test2
              label3: test3
              rds: core
            name: all-to-default
            outputRefs:
              - kafka-open
    # configure Monitoring
    - fileName: "GenericConfigMap.yaml"
      policyName: "dedicated-service-monitor"
      metadata:
        name: cluster-monitoring-config
        namespace: openshift-monitoring
        annotations:
          ran.openshift.io/ztp-deploy-wave: "16"
      data:
        config.yaml: |
          prometheusK8s:
            retention: 15d
            volumeClaimTemplate:
              spec:
                storageClassName: ocs-external-storagecluster-ceph-rbd
                resources:
                  requests:
                    storage: 100Gi
          alertmanagerMain:
            volumeClaimTemplate:
              spec:
                storageClassName: ocs-external-storagecluster-ceph-rbd
                resources:
                  requests:
                    storage: 20Gi
    # configure custom Namespaces
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-macvlan-wlkd
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-sriov-wlkd
    # configure MACVLAN networks
    - fileName: AddAdditionalNetworks.yaml
      policyName: "configure-macvlan"
      spec:
        additionalNetworks:
        - name: pc-mm-ext
          namespace: rds-macvlan-wlkd
          rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "pc-mm-ext", "plugins": [{"type": "macvlan", "master": "bond1", "ipam": {}}] }'
          type: Raw
        - name: eric-pc-routing-engine-net0
          namespace: rds-macvlan-wlkd
          rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "eric-pc-routing-engine-net0", "plugins": [ {"type": "macvlan", "master": "bond1", "mode": "private" },{ "type": "tuning", "name": "tuning-arp" }] }'
          type: Raw
        - name: eric-pc-vpn-gateway-forwarder-common
          namespace: rds-macvlan-wlkd
          rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "eric-pc-vpn-gateway-forwarder-common", "plugins": [{"type": "macvlan", "master": "bond1", "mode": "bridge" }, { "type": "tuning", "name": "tuning-arp" }]}'
          type: Raw
        - name: eric-pc-routing-engine
          namespace: rds-sriov-wlkd
          rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "eric-pc-routing-engine", "plugins": [{"type": "macvlan", "master": "bond1", "mode": "private" }, { "type": "tuning", "name": "tuning-arp" }]}'
          type: Raw
    #
    # Configuration for Rootless Pods(fromRDS)
    #
    - fileName: MachineConfigGeneric.yaml
      policyName: "rootless-pods"
      metadata:
        name: 99-worker-setsebool
        annotations:
          ran.openshift.io/ztp-deploy-wave: "4"
        labels:
          machineconfiguration.openshift.io/role: worker
      spec:
        config:
          ignition:
            version: 3.2.0
          systemd:
            units:
              - contents: |
                  [Unit]
                  Description=Set SELinux boolean for tap cni plugin
                  Before=kubelet.service

                  [Service]
                  Type=oneshot
                  ExecStart=/sbin/setsebool container_use_devices=on
                  RemainAfterExit=true

                  [Install]
                  WantedBy=multi-user.target graphical.target
                enabled: true
                name: setsebool.service
