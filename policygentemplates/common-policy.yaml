---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "common"
  namespace: "ztp-common"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    - fileName: required/networking/Network.yaml
      policyName: "config-network"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"
      spec:
        defaultNetwork:
          ovnKubernetesConfig:
            mtu: 8900
            gatewayConfig:
              ipForwarding: "Global"
              routingViaHost: true
        additionalNetworks:
        - name: mc-vlan-one
          namespace: rds-macvlan-wlkd
          rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "mc-vlan-one", "plugins": [{"type": "macvlan", "master": "bond1", "ipam": {}}] }'
          type: Raw
        - name: mc-vlan-two
          namespace: rds-macvlan-wlkd
          rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "mc-vlan-two", "plugins": [{"type": "macvlan", "master": "bond1", "mode": "private" }]}'
          type: Raw

    - fileName: required/other/operator-hub.yaml
      policyName: "disable-operator-hub"
      complianceType: mustonlyhave
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"

    - fileName: required/other/catalog-source.yaml
      policyName: "config-policy"
      metadata:
        name: redhat-operators-disconnected
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"
      spec:
        displayName: Red Hat Disconnected Operators Catalog
        image: registry.ecore.lab.eng.tlv2.redhat.com:5000/olm/redhat-operators:v4.17
        publisher: Red Hat
        sourceType: grpc

    - fileName: required/other/catalog-source.yaml
      policyName: "config-policy"
      metadata:
        name: redhat-operators-previous
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"
      spec:
        displayName: Red Hat 4.16
        image: registry.ecore.lab.eng.tlv2.redhat.com:5000/olm/redhat-operators:v4.16
        publisher: Red Hat
        sourceType: grpc

    #
    # configure ICSP
    #
    - fileName: required/other/icsp.yaml
      policyName: "config-policy"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "1"
      spec:
        repositoryDigestMirrors:
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
            source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-v4.0-art-dev
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/ocp/release
            source: registry.ci.openshift.org/ocp/release
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry.redhat.io
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry-proxy.engineering.redhat.com
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005
            source: registry.stage.redhat.io
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-qe-optional-operators
            source: quay.io/openshift-qe-optional-operators
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshifttest
            source: quay.io/openshifttest
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/rh-nfv-int
            source: quay.io/rh-nfv-int
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/intel
            source: registry.connect.redhat.com/intel
          - mirrors:
            - registry.ecore.lab.eng.tlv2.redhat.com:5005/openshift-release-dev/ocp-release-nightly
            source: quay.io/openshift-release-dev/ocp-release-nightly
    #
    # install and configure SR-IOV operator
    #
    - fileName: required/networking/sriov/SriovSubscriptionNS.yaml
      policyName: "install-operators-sriov"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/networking/sriov/SriovSubscriptionOperGroup.yaml
      policyName: "install-operators-sriov"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/networking/sriov/SriovSubscription.yaml
      policyName: "install-operators-sriov"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
      spec:
        channel: "stable"
        source: redhat-operators-disconnected
        installPlanApproval: "Automatic"
    - fileName: required/networking/sriov/SriovOperatorConfig.yaml
      policyName: "config-operators-sriov"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "10"
    #
    # install and configure MetalLB operator
    # MetalLB operator configuration moved to a site folder
    #
    - fileName: required/networking/metallb/metallbNS.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/networking/metallb/metallbOperGroup.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/networking/metallb/metallbSubscription.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
      spec:
        channel: "stable"
        source: redhat-operators-previous
        installPlanApproval: "Automatic"
    #
    # install and configure NROP
    #
    - fileName: required/scheduling/NROPSubscriptionNS.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/scheduling/NROPSubscriptionOperGroup.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/scheduling/NROPSubscription.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
      spec:
        # TODO: update when 4.17 version is available
        channel: "4.16"
        source: redhat-operators-disconnected
    - fileName: required/scheduling/nrop.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
      spec:
        nodeGroups:
        - machineConfigPoolSelector:
            matchLabels:
              # This label must match the pool(s) you want to run NUMA-aligned workloads
              pools.operator.machineconfiguration.openshift.io/customcnf: ""
    - fileName: required/scheduling/sched.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
      spec:
        #cacheResyncPeriod: "0"
        # Image spec should be the latest for the release
        imageSpec: "registry.ecore.lab.eng.tlv2.redhat.com:5000/nrop/noderesourcetopology-scheduler-rhel9:v4.17.0"
    #
    # install NMState operator
    #
    - fileName: required/networking/NMStateNS.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/networking/NMStateOperGroup.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/networking/NMStateSubscription.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: required/networking/NMState.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"

    #
    # install and configure Logging
    #
    - fileName: optional/logging/ClusterLogNS.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: optional/logging/ClusterLogOperGroup.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    - fileName: optional/logging/ClusterLogSubscription.yaml
      policyName: "install-operators"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
      spec:
        source: redhat-operators-disconnected
        installPlanApproval: Automatic
    # NOTE(yprokule): ClusterLogging instance by default uses wave 10
    #               : thefore dedicated policy
    #               : trying to use same wave
    - fileName: optional/logging/ClusterLogging.yaml
      policyName: "install-operators"
      #policyName: "cluster-logging-configure"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
    # NOTE(yprokule): ClusterLogForwarder.yaml has to be added
    #               : after central server for logs is available
    #               : trying to use same wave
    - fileName: optional/logging/ClusterLogForwarder.yaml
      policyName: "install-operators"
      #policyName: "config-policy-configure"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "2"
      spec:
        outputs:
          - type: "kafka"
            name: kafka-open
            # use FQDN when DNS entries for IPv4 and IPv6 are in place
            # only IPv4 IP address works
            #  url: tcp://vran-qe-kafka.lab.eng.rdu2.redhat.com:9092/vran-qe
            url: tcp://vran-qe-kafka.kni-qe-11.lab.eng.rdu2.redhat.com:9092/vran-qe
        pipelines:
          - inputRefs:
              - audit
              - infrastructure
            labels:
              label1: test1
              label2: test2
              label3: test3
              rds: core
            name: all-to-default
            outputRefs:
              - kafka-open
    # configure Monitoring
    - fileName: optional/other/monitoring-config-cm.yaml
      policyName: "dedicated-service-monitor"
      metadata:
        name: cluster-monitoring-config
        namespace: openshift-monitoring
        annotations:
          ran.openshift.io/ztp-deploy-wave: "16"
      data:
        config.yaml: |
          prometheusK8s:
            retention: 1d
            volumeClaimTemplate:
              spec:
                storageClassName: ocs-external-storagecluster-ceph-rbd
                resources:
                  requests:
                    storage: 10Gi
          alertmanagerMain:
            volumeClaimTemplate:
              spec:
                storageClassName: ocs-external-storagecluster-ceph-rbd
                resources:
                  requests:
                    storage: 20Gi
    # configure custom Namespaces
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-macvlan-wlkd
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-sriov-wlkd
    - fileName: customNamespace.yaml
      policyName: "custom-namespaces"
      metadata:
        name: rds-nrop-wlkd
    # configure MACVLAN networks
    #- fileName: AddAdditionalNetworks.yaml
    #  policyName: "configure-macvlan"
    #  spec:
    #    additionalNetworks:
    #    - name: mc-vlan-one
    #      namespace: rds-macvlan-wlkd
    #      rawCNIConfig: '{ "cniVersion": "0.3.1", "name": "mc-vlan-one", "plugins": [{"type": "macvlan", "master": "bond1", "ipam": {}}] }'
    #      type: Raw
    #    - name: mc-vlan-two
    #      namespace: rds-macvlan-wlkd
    #      rawCNIConfig: '{ "cniVersion": "0.4.0", "name": "mc-vlan-two", "plugins": [{"type": "macvlan", "master": "bond1", "mode": "private" }]}'
    #      type: Raw
    #
    # Configuration for Rootless Pods(fromRDS)
    #
    - fileName: optional/networking/multus/tap_cni/mc_rootless_pods_selinux.yaml
      policyName: "rootless-pods"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "4"
