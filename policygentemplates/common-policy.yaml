---
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "common"
  namespace: "ztp-common"
spec:
  bindingRules:
    site: "ecore"
    zone: "tlv2"
  remediationAction: inform
  sourceFiles:
    - fileName: RoutingViaHost.yaml
      policyName: "config-network"
    - fileName: OperatorHub.yaml
      policyName: "disable-operator-hub"
    - fileName: DefaultCatsrc.yaml
      policyName: "config-policy"
      metadata:
          name: redhat-operators-disconnected
      spec:
        displayName: Red Hat Operators Catalog
        image: registry.ecore.lab.eng.tlv2.redhat.com:5000/olm/redhat-operators:v4.14
    # install and configure SR-IOV operator
    - fileName: SriovSubscriptionNS.yaml
      policyName: "sriov-operator-policy"
    - fileName: SriovSubscriptionOperGroup.yaml
      policyName: "sriov-operator-policy"
    - fileName: SriovSubscription.yaml
      policyName: "sriov-operator-policy"
      spec:
        channel: "4.14"
        source: redhat-operators-disconnected
        installPlanApproval: "Automatic"
    - fileName: SriovOperatorConfig.yaml
      policyName: "sriov-operator-policy-config"
      spec:
        configDaemonNodeSelector:
          node-role.kubernetes.io/ht100gb: ""
    # install and configure MetalLB operator
    - fileName: metallb/ns.yaml
      policyName: "metallb-operator-policy"
    - fileName: metallb/operatorGroup.yaml
      policyName: "metallb-operator-policy"
    - fileName: metallb/subscription.yaml
      policyName: "metallb-operator-policy"
      spec:
        channel: "stable"
        source: redhat-operators-disconnected
        installPlanApproval: "Automatic"
    - fileName: metallb/instance.yaml
      policyName: "metallb-operator-policy"
    # confgire MetalLB operator
    - fileName: metallb/bfdProfile.yaml
      policyName: "metallb-operator-config-policy"
    - fileName: metallb/bgpPeer.yaml
      policyName: "metallb-operator-config-policy"
    - fileName: metallb/community.yaml
      policyName: "metallb-operator-config-policy"
    - fileName: metallb/ipAddressPool.yaml
      policyName: "metallb-operator-config-policy"
    - fileName: metallb/bgpAdvertisement.yaml
      policyName: "metallb-operator-config-policy"
    # label HT nodes
    - fileName: LabelHTNode.yaml
      policyName: "label-node"
      metadata:
        name: openshift-worker-0.ecore.lab.eng.tlv2.redhat.com
        labels:
          node-role.kubernetes.io/standard: ''
          env: "qe"
    - fileName: LabelHTNode.yaml
      policyName: "label-node"
      metadata:
        name: openshift-worker-1.ecore.lab.eng.tlv2.redhat.com
        labels:
          node-role.kubernetes.io/standard: ''
          env: "qe"
    - fileName: LabelHTNode.yaml
      policyName: "label-node"
      metadata:
        name: openshift-worker-2.ecore.lab.eng.tlv2.redhat.com
        labels:
          node-role.kubernetes.io/ht100gb: ''
          env: "qe"
      spec:
        taints:
          - effect: NoSchedule
            key: sriov
            value: "true"
    - fileName: LabelHTNode.yaml
      policyName: "label-node"
      metadata:
        name: openshift-worker-3.ecore.lab.eng.tlv2.redhat.com
        labels:
          node-role.kubernetes.io/ht100gb: ''
          env: "qe"
      spec:
        taints:
          - effect: NoSchedule
            key: sriov
            value: "true"
    # install ODF operator
    - fileName: odf/ns.yaml
      policyName: "odf-operator-install"
    - fileName: odf/operatorGroup.yaml
      policyName: "odf-operator-install"
    - fileName: odf/subscription.yaml
      policyName: "odf-operator-install"
    # configure ODF operator
    - fileName: odf/external-ceph-secret.yaml
      policyName: "odf-operator-configure"
    - fileName: odf/odf-storage-cluster.yaml
      policyName: "odf-operator-configure"
    # storage classes from ODF
    - fileName: StorageClass.yaml
      policyName: "odf-storage-classes"
      metadata:
        name: ocs-external-storagecluster-ceph-rbd
      provisioner: openshift-storage.rbd.csi.ceph.com
      reclaimPolicy: Delete
    - fileName: StorageClass.yaml
      policyName: "odf-storage-classes"
      metadata:
        name: ocs-external-storagecluster-cephfs
      provisioner: openshift-storage.cephfs.csi.ceph.com
      reclaimPolicy: Delete
    - fileName: StorageClass.yaml
      policyName: "odf-storage-classes"
      metadata:
        name: openshift-storage.noobaa.io
      provisioner: "openshift-storage.noobaa.io/obc"
      reclaimPolicy: Delete
    # configure MachineConfigPools
    - fileName: MachineConfigPool.yaml
      policyName: "config-policy"
      metadata:
        name: ht100gb
        labels:
          machineconfiguration.openshift.io/role: ht100gb
      spec:
        maxUnavailable: 1
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values:
                - worker
                - ht100gb
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/ht100gb: ""
        paused: false
    - fileName: MachineConfigPool.yaml
      policyName: "config-policy"
      metadata:
        name: standard
        labels:
          machineconfiguration.openshift.io/role: standard
      spec:
        maxUnavailable: "90%"
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values:
                - worker
                - standard
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/standard: ""
        paused: false
